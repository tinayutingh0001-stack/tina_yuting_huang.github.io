locale: "en-US"
title: "Tina Yuting Huang, Ph.D."
name: "Tina Yuting Huang"
description: "Postdoctoral researcher and faculty candidate integrating microfluidics, biomaterials, quantitative biophysics, simulation, and machine learning for programmable therapeutic delivery."
url: "https://tinayutingh0001-stack.github.io"
baseurl: "/tina_yuting_huang.github.io"
repository: "tinayutingh0001-stack/tina_yuting_huang.github.io"
timezone: "America/New_York"

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true

permalink: pretty
future: false
encoding: "utf-8"

sass:
  style: compressed

plugins:
  - jekyll-sitemap
  - jekyll-redirect-from

exclude:
  - AGENTS.md
  - Gemfile
  - Gemfile.lock
  - HANDOFF.md
  - LICENSE
  - node_modules
  - package-lock.json
  - README.md
  - vendor
  - work
