name: Publish prepared faculty website

on:
  push:
    branches: ["master"]
    paths: ["site-source.tar.gz"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Import the prepared source
        shell: bash
        run: |
          set -euo pipefail
          source_dir="$RUNNER_TEMP/site-source"
          mkdir -p "$source_dir"
          tar -xzf site-source.tar.gz -C "$source_dir"
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/workflows/' \
            "$source_dir/" ./
          rm -f site-source.tar.gz
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish faculty candidate website"
          git push origin HEAD:master

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1.328.0
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6.0.0

      - name: Build with Jekyll
        run: bundle exec jekyll build --strict_front_matter --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
