  <text x="42" y="50" fill="#15201f" font-family="Georgia, serif" font-size="24">A closed-loop platform for therapeutic delivery</text>
  <text x="42" y="78" fill="#5e6763" font-family="Arial, sans-serif" font-size="13">Molecules → materials → mechanics → predictive models → delivery systems</text>

