<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 570" role="img" aria-labelledby="title desc">
  <title id="title">Research design-build-measure-learn pipeline</title>
  <desc id="desc">Conceptual diagram connecting molecular and material design, microfluidic manufacture, quantitative measurement, machine-learning-guided modeling, and programmable delivery.</desc>
