<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" role="img" aria-labelledby="title desc">
  <title id="title">Materials and sequence design for stable programmable delivery</title>
  <desc id="desc">Conceptual illustration distinguishing lipid nanoparticles, a hydrogel network, polymer-shell microparticles, and a microneedle array, alongside a design-measure-learn cycle for mRNA sequences.</desc>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0l10 5-10 5z" fill="#0d6764"/></marker>
    <pattern id="mesh" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M0 8h16M8 0v16" stroke="#47738a" stroke-width="1" opacity=".5"/></pattern>
  </defs>
  <rect width="760" height="560" rx="24" fill="#fffdf8"/>
  <text x="34" y="42" fill="#15201f" font-family="Georgia, serif" font-size="22">Coordinate sequence, formulation, and device</text>

  <g transform="translate(34 82)">
    <text x="0" y="0" fill="#a94835" font-family="Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1">MATERIAL IDENTITIES</text>
    <g transform="translate(0 30)">
      <circle cx="50" cy="52" r="35" fill="#dbe9e5" stroke="#0d6764" stroke-width="4"/>
      <path d="M30 51c10-15 20 15 30 0s19 11 24 3" fill="none" stroke="#a94835" stroke-width="3"/>
      <text x="12" y="106" fill="#15201f" font-family="Arial, sans-serif" font-size="11" font-weight="700">mRNA–LNP</text>
      <text x="6" y="123" fill="#5e6763" font-family="Arial, sans-serif" font-size="9">lipid carrier</text>
    </g>
    <g transform="translate(122 30)">
      <rect x="3" y="15" width="90" height="72" rx="19" fill="url(#mesh)" stroke="#47738a" stroke-width="3"/>
      <text x="18" y="106" fill="#15201f" font-family="Arial, sans-serif" font-size="11" font-weight="700">Hydrogel</text>
      <text x="12" y="123" fill="#5e6763" font-family="Arial, sans-serif" font-size="9">water-rich mesh</text>
    </g>
    <g transform="translate(252 30)">
      <circle cx="48" cy="51" r="39" fill="#f4ded5" stroke="#a94835" stroke-width="8"/>
      <circle cx="48" cy="51" r="27" fill="url(#mesh)" stroke="#47738a"/>
      <circle cx="39" cy="44" r="4" fill="#0d6764"/><circle cx="57" cy="58" r="4" fill="#0d6764"/>
      <text x="4" y="106" fill="#15201f" font-family="Arial, sans-serif" font-size="11" font-weight="700">Microparticle</text>
      <text x="1" y="123" fill="#5e6763" font-family="Arial, sans-serif" font-size="9">hydrogel core · PLGA shell</text>
    </g>
    <g transform="translate(406 30)">
      <path d="M2 83h114v18H2z" fill="#dbe9e5" stroke="#0d6764" stroke-width="2"/>
      <path d="M15 83l12-55 12 55m10 0l12-55 12 55m10 0l12-55 12 55" fill="#f1e5c8" stroke="#80601f" stroke-width="2"/>
      <circle cx="27" cy="60" r="4" fill="#a94835"/><circle cx="61" cy="49" r="4" fill="#a94835"/><circle cx="95" cy="65" r="4" fill="#a94835"/>
      <text x="23" y="122" fill="#15201f" font-family="Arial, sans-serif" font-size="11" font-weight="700">Microneedles</text>
    </g>
  </g>

  <line x1="34" y1="275" x2="726" y2="275" stroke="#d8d2c6"/>

  <g transform="translate(34 316)">
    <text x="0" y="0" fill="#a94835" font-family="Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1">SEQUENCE DESIGN LOOP</text>
    <g transform="translate(0 38)">
      <rect width="150" height="104" rx="18" fill="#f5f1e8" stroke="#d8d2c6"/>
      <path d="M21 47c13-20 27 20 40 0s27 20 40 0 20 9 28 2" fill="none" stroke="#0d6764" stroke-width="4" stroke-linecap="round"/>
      <text x="22" y="84" fill="#15201f" font-family="Arial, sans-serif" font-size="11" font-weight="700">Design libraries</text>
    </g>
    <path d="M167 90h45" stroke="#0d6764" stroke-width="3" marker-end="url(#a)"/>
    <g transform="translate(229 38)">
      <rect width="150" height="104" rx="18" fill="#f5f1e8" stroke="#d8d2c6"/>
      <g fill="#a94835"><circle cx="34" cy="40" r="8"/><circle cx="65" cy="62" r="8"/><circle cx="96" cy="34" r="8"/><circle cx="119" cy="66" r="8"/></g>
      <path d="M23 78h105" stroke="#47738a" stroke-width="2"/>
      <text x="26" y="94" fill="#15201f" font-family="Arial, sans-serif" font-size="11" font-weight="700">Measure function</text>
    </g>
    <path d="M396 90h45" stroke="#0d6764" stroke-width="3" marker-end="url(#a)"/>
    <g transform="translate(458 38)">
      <rect width="150" height="104" rx="18" fill="#f5f1e8" stroke="#d8d2c6"/>
      <g transform="translate(22 22)"><rect width="20" height="20" fill="#dbe9e5"/><rect x="23" width="20" height="20" fill="#0d6764"/><rect x="46" width="20" height="20" fill="#8cb9ae"/><rect y="23" width="20" height="20" fill="#f4ded5"/><rect x="23" y="23" width="20" height="20" fill="#a94835"/><rect x="46" y="23" width="20" height="20" fill="#e5d7b5"/></g>
      <text x="21" y="84" fill="#15201f" font-family="Arial, sans-serif" font-size="11" font-weight="700">Learn design rules</text>
    </g>
    <path d="M608 142c44 43 36 78-89 79H83c-41 0-62-28-62-51" fill="none" stroke="#0d6764" stroke-width="2" marker-end="url(#a)"/>
    <text x="236" y="198" fill="#5e6763" font-family="Arial, sans-serif" font-size="10">High-throughput IVT/IVTT + machine learning guide the next design cycle</text>
  </g>
